name: Windows installer release
on:
  push:
    branches: [main]
    paths: [packaging/windows/release-notes.md, .github/workflows/release-windows.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: formabox-release-windows
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 75
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare bundled engines and source attachments
        run: |
          ./scripts/stage-windows-engines.ps1 -EngineDirectory build/windows-engines -SourceDirectory build/engine-sources -WorkDirectory (Join-Path $env:RUNNER_TEMP 'formabox-engines')
      - name: Install and test worker dependencies
        run: |
          $engineRoot = (Resolve-Path build/windows-engines).Path
          $env:Path = "$engineRoot\ffmpeg;$engineRoot\tesseract;$env:Path"
          $env:FORMABOX_SOFFICE = Join-Path $engineRoot 'libreoffice/program/soffice.com'
          $env:TESSDATA_PREFIX = Join-Path $engineRoot 'tesseract/tessdata'
          python -m pip install -r packaging/windows/runtime-requirements.txt -e './worker[test]'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pytest -q -ra tests
      - name: Build Windows x64 desktop
        run: |
          cmake -S . -B build/release -G 'Visual Studio 17 2022' -A x64
          cmake --build build/release --config Release --parallel
      - name: Build installer
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'NSIS/makensis.exe'
          if (!(Test-Path -LiteralPath $compiler)) { throw 'NSIS is missing from the Windows runner image' }
          & $compiler /VERSION
          ./scripts/package-windows.ps1 -BuildDirectory build/release -Python (Get-Command python).Source -MakeNsis $compiler -QtPrefix $env:QT_ROOT_DIR -EngineBundleDirectory build/windows-engines
      - name: Install, start, test and uninstall
        run: |
          $setup = Get-ChildItem build/installers -Filter '*-Full-Setup.exe' -File
          ./scripts/test-windows-installer.ps1 -Setup $setup.FullName -ExpectBundledEngines
      - name: Retain installer when validation fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-validation
          path: build/installers/*-Full-Setup.exe*
          compression-level: 0
          retention-days: 3
          if-no-files-found: ignore
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = Get-ChildItem build/installers -Filter '*-Full-Setup.exe' -File
          if ($setup.Name -notmatch '^FormaBox-(\d+\.\d+\.\d+)-Windows-x64-Full-Setup\.exe$') {
              throw 'Unexpected installer filename'
          }
          $version = $Matches[1]
          $tag = "v$version"
          gh release view $tag --json tagName
          if ($LASTEXITCODE -eq 0) { throw "$tag already exists. Bump the project version before publishing." }
          $sources = @(
            'FFmpeg-Windows-Build-Sources.tar.gz',
            'FFmpeg-Windows-Dependency-Sources.tar',
            'Tesseract-Windows-Build-Sources.tar.gz'
          ) | ForEach-Object { (Resolve-Path -LiteralPath (Join-Path 'build/engine-sources' $_)).Path }
          gh release create $tag $setup.FullName "$($setup.FullName).sha256" @sources --target $env:GITHUB_SHA --title "万象 $version · Windows 完整预览版" --notes-file packaging/windows/release-notes.md --prerelease --draft
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          gh release edit $tag --draft=false
