name: Windows installer release
on:
  push:
    branches: [main]
    paths: [packaging/windows/release-notes.md]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: formabox-release-windows
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
      - name: Install and test worker dependencies
        run: |
          python -m pip install -r packaging/windows/runtime-requirements.txt -e './worker[test]'
          python -m pytest -q -ra tests
      - name: Build Windows x64 desktop
        run: |
          cmake -S . -B build/release -G 'Visual Studio 17 2022' -A x64
          cmake --build build/release --config Release --parallel
      - name: Build installer
        run: |
          $url = 'https://downloads.sourceforge.net/project/nsis/NSIS%203/3.13/nsis-3.13.zip'
          $zip = Join-Path $env:RUNNER_TEMP 'nsis-3.13.zip'
          Invoke-WebRequest -Uri $url -OutFile $zip -MaximumRetryCount 2
          $expected = 'ba63dffc4410ee89193e1cb5a41989991bd77c61068da17e3156d136b7b0b3d8'
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne $expected) {
              throw 'NSIS compiler archive hash mismatch'
          }
          $nsis = Join-Path $env:RUNNER_TEMP 'nsis'
          Expand-Archive -LiteralPath $zip -DestinationPath $nsis
          $compiler = Get-ChildItem $nsis -Filter makensis.exe -Recurse | Select-Object -First 1
          ./scripts/package-windows.ps1 -BuildDirectory build/release -Python (Get-Command python).Source -MakeNsis $compiler.FullName -QtPrefix $env:QT_ROOT_DIR
      - name: Install, start, test and uninstall
        run: |
          $setup = Get-ChildItem build/installers -Filter '*-Setup.exe' -File
          ./scripts/test-windows-installer.ps1 -Setup $setup.FullName
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = Get-ChildItem build/installers -Filter '*-Setup.exe' -File
          if ($setup.Name -notmatch '^FormaBox-(\d+\.\d+\.\d+)-Windows-x64-Setup\.exe$') {
              throw 'Unexpected installer filename'
          }
          $version = $Matches[1]
          $tag = "v$version"
          gh release view $tag --json tagName
          if ($LASTEXITCODE -eq 0) { throw "$tag already exists. Bump the project version before publishing." }
          gh release create $tag $setup.FullName "$($setup.FullName).sha256" --target $env:GITHUB_SHA --title "万象 $version · Windows 预览版" --notes-file packaging/windows/release-notes.md --prerelease