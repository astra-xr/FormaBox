name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  worker:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg tesseract-ocr libreoffice-writer
      - run: python -m pip install -e './worker[test]'
      - run: python -m pytest -q -ra tests
  desktop:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build Omnora and verify the development launcher
        shell: pwsh
        run: |
          python -m pip install -r packaging/windows/runtime-requirements.txt -e './worker'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake -S . -B build/desktop -G 'Visual Studio 17 2022' -A x64
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build/desktop --config Release --parallel
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $stage = Join-Path $env:GITHUB_WORKSPACE 'build/desktop-check'
          cmake --install build/desktop --config Release --prefix (Join-Path $stage 'dist')
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item -LiteralPath build/desktop/launcher/Release/Omnora.exe -Destination build/desktop-check/Omnora.exe
          $env:FORMABOX_PYTHON = (Get-Command python).Source
          $env:QT_QUICK_BACKEND = 'software'
          $env:QT_FORCE_STDERR_LOGGING = '1'
          $process = Start-Process -FilePath (Join-Path $stage 'Omnora.exe') -ArgumentList '--verify-runtime' -WindowStyle Hidden -PassThru -Wait
          if ($process.ExitCode) {
              $log = Join-Path $stage 'desktop.log'
              Start-Process -FilePath (Join-Path $stage 'dist/Omnora.exe') -ArgumentList '--verify-runtime' -WindowStyle Hidden -RedirectStandardError $log -Wait
              Get-Content -LiteralPath $log -Encoding utf8
              exit $process.ExitCode
          }
      - name: Compile the installer template
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'NSIS/makensis.exe'
          $fixture = New-Item -ItemType Directory -Force -Path 'build/installer-check/payload'
          Copy-Item -LiteralPath build/desktop-check/dist/Omnora.exe -Destination $fixture.FullName
          $uninstall = Join-Path $fixture.Parent.FullName 'uninstall.nsh'
          'Delete "$INSTDIR\Omnora.exe"' | Set-Content -LiteralPath $uninstall -Encoding utf8BOM
          $setup = Join-Path $fixture.Parent.FullName 'Omnora-installer-check.exe'
          $icon = (Resolve-Path 'desktop/assets/formabox.ico').Path
          $version = (Select-String -LiteralPath CMakeLists.txt -Pattern '^project\(Omnora VERSION (\d+\.\d+\.\d+) ').Matches[0].Groups[1].Value
          & $compiler /INPUTCHARSET UTF8 /WX "/DSETUP_EXE=$setup" "/DFORMABOX_VERSION=$version" "/DPAYLOAD=$($fixture.FullName)" "/DUNINSTALL_LIST=$uninstall" "/DFORMABOX_ICON=$icon" packaging/windows/installer.nsi
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ((Get-Item -LiteralPath $setup).VersionInfo.ProductName -ne '万象（Omnora）') {
              throw 'Installer metadata does not match the application name'
          }
      - uses: actions/upload-artifact@v4
        with:
          name: omnora-windows-executables
          path: |
            build/desktop-check/Omnora.exe
            build/desktop-check/dist/Omnora.exe
          if-no-files-found: error
          retention-days: 3
      - name: Prepare verified engine and speech fixtures
        if: github.ref == 'refs/heads/qa/omnora-091-tool-registry'
        shell: pwsh
        run: |
          $fixtures = (New-Item -ItemType Directory -Force -Path 'build/qa-fixtures').FullName
          function Save-Fixture([string]$url, [string]$file, [string]$sha256) {
            curl.exe --fail --location --retry 3 --silent --show-error --output $file $url
            if ($LASTEXITCODE -or (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash -ne $sha256) {
              throw "Invalid QA fixture: $file"
            }
          }
          $setup = Join-Path $fixtures 'baseline-setup.exe'
          Save-Fixture 'https://github.com/astra-xr/Omnora/releases/download/v0.9.0/FormaBox-0.9.0-Windows-x64-Full-Setup.exe' $setup '4a071286003863138fca327aaf6a88e77fedfbaab8c8ca581b1837b4f63ed4b1'
          Save-Fixture 'https://github.com/astra-xr/Omnora/releases/download/v0.9.0/Whisper-Multilingual-Tiny.bin' (Join-Path $fixtures 'speech-model.bin') 'be07e048e1e599ad46341c8d2a135645097a538221678b7acdd1b1919c6e1b21'
          Save-Fixture 'https://raw.githubusercontent.com/ggml-org/whisper.cpp/v1.8.3/samples/jfk.wav' (Join-Path $fixtures 'speech-test.wav') '59dfb9a4acb36fe2a2affc14bacbee2920ff435cb13cc314a08c13f66ba7860e'
          $baseline = Join-Path $env:RUNNER_TEMP 'omnora-baseline-090'
          $installed = Start-Process -FilePath $setup -ArgumentList "/S /D=$baseline" -WindowStyle Hidden -PassThru -Wait
          if ($installed.ExitCode) { throw 'Unable to extract engines from the verified release installer' }
          $uninstaller = Join-Path $baseline 'Uninstall.exe'
          try {
            $engineRoot = Join-Path $fixtures 'engines'
            robocopy.exe (Join-Path $baseline 'engines') $engineRoot /E /XJ /R:0 /W:0 /NFL /NDL /NJH /NJS /NP
            if ($LASTEXITCODE -ge 8 -or !(Test-Path -LiteralPath (Join-Path $engineRoot 'NOTICES.txt'))) {
              throw 'The released engine bundle is incomplete'
            }
          } finally {
            $removed = Start-Process -FilePath $uninstaller -ArgumentList "/S _?=$baseline" -WindowStyle Hidden -PassThru -Wait
            if ($removed.ExitCode) { throw 'The baseline installer did not uninstall cleanly' }
          }
          exit 0
      - name: Run Windows worker tests with the bundled engines
        if: github.ref == 'refs/heads/qa/omnora-091-tool-registry'
        shell: pwsh
        run: |
          $engineRoot = (Resolve-Path -LiteralPath 'build/qa-fixtures/engines').Path
          $env:Path = "$engineRoot\ffmpeg;$engineRoot\tesseract;$env:Path"
          $env:FORMABOX_SOFFICE = Join-Path $engineRoot 'libreoffice/program/soffice.com'
          $env:TESSDATA_PREFIX = Join-Path $engineRoot 'tesseract/tessdata'
          python -m pip install -e './worker[test]'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pytest -q -ra tests
          exit $LASTEXITCODE
      - name: Verify bundled engine paths and run tools in the desktop staging directory
        if: github.ref == 'refs/heads/qa/omnora-091-tool-registry'
        shell: pwsh
        run: |
          $stage = (Resolve-Path 'build/desktop-check').Path
          $runtime = Join-Path $stage 'dist'
          $target = Join-Path $runtime 'engines'
          robocopy.exe build/qa-fixtures/engines $target /E /XJ /R:0 /W:0 /NFL /NDL /NJH /NJS /NP
          if ($LASTEXITCODE -ge 8) { throw 'Could not stage the verified release engines' }
          $env:FORMABOX_WORKER_DIR = Join-Path $runtime 'worker'
          $env:PYTHONPATH = $env:FORMABOX_WORKER_DIR
          $env:FORMABOX_PYTHON = (Get-Command python).Source
          $env:PYTHONUTF8 = '1'
          $env:QT_QUICK_BACKEND = 'software'
          $env:QT_FORCE_STDERR_LOGGING = '1'
          $env:FORMABOX_TEST_AUDIO = (Resolve-Path 'build/qa-fixtures/speech-test.wav').Path
          $env:FORMABOX_TEST_MODEL = (Resolve-Path 'build/qa-fixtures/speech-model.bin').Path
          $json = python -X utf8 -B -m formabox check-engines
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $results = ($json | ConvertFrom-Json).result
          $paths = @{
              LibreOffice = 'libreoffice/program/soffice.com'
              ffmpeg = 'ffmpeg/ffmpeg.exe'
              tesseract = 'tesseract/tesseract.exe'
              'whisper-cli' = 'whisper/whisper-cli.exe'
          }
          foreach ($id in $paths.Keys) {
              $expected = (Resolve-Path -LiteralPath (Join-Path $target $paths[$id])).Path
              if (!$results.$id.ok -or $results.$id.path -ne $expected) {
                  throw "Bundled engine $id failed: $($results.$id.message)"
              }
              Write-Host "Verified $($id): $($results.$id.message)"
          }
          $stale = Join-Path $stage 'stale.exe'
          $env:FORMABOX_SOFFICE = $stale
          $env:FORMABOX_FFMPEG = $stale
          $env:FORMABOX_TESSERACT = $stale
          $env:FORMABOX_WHISPER = $stale
          $env:TESSDATA_PREFIX = Join-Path $stage 'stale-tessdata'
          $log = Join-Path $stage 'bundled-verify.log'
          $verify = Start-Process -FilePath (Join-Path $runtime 'Omnora.exe') -ArgumentList '--verify-runtime' -WindowStyle Hidden -RedirectStandardError $log -PassThru -Wait
          Get-Content -LiteralPath $log -Encoding utf8
          if ($verify.ExitCode) { exit $verify.ExitCode }
          Remove-Item Env:FORMABOX_SOFFICE,Env:FORMABOX_FFMPEG,Env:FORMABOX_TESSERACT,Env:FORMABOX_WHISPER,Env:TESSDATA_PREFIX
          python -X utf8 -B tests/smoke_tools.py --scratch $stage --report (Join-Path $stage 'engine-smoke.json')
          exit $LASTEXITCODE
