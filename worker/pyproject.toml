[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "formabox-worker"
version = "0.1.4"
requires-python = ">=3.11"
dependencies = ["Pillow>=11.3,<13", "pypdf>=5.9,<7", "pypdfium2>=4.30,<6", "cryptography>=44,<48"]
[project.optional-dependencies]
heic = ["pillow-heif>=0.21"]
test = ["pytest>=8"]
[project.scripts]
formabox-worker = "formabox.__main__:main"
[tool.setuptools.packages.find]
where = ["."]
